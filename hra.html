<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indukční ohřev s DHI-191 HD – mini hra | Dawell</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF702B; --orange-2:#FF9254; --orange-soft:rgba(255,112,43,.16);
  --bg:#0E1013; --panel:#1A1E24; --panel-2:#20252C; --line:#2A3039; --line-2:#363D48;
  --text:#EEF0F3; --muted:#9BA4B0; --dim:#6B7482; --cold:#5EC4F2; --ok:#49D17D; --bad:#FF5A5A;
  --font:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;user-select:none;-webkit-user-select:none}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
header a{color:var(--muted);text-decoration:none;font-size:14px}
header a:hover{color:var(--text)}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px;letter-spacing:-.02em}
h1 span{color:var(--orange-2)}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.5}
.sub b{color:var(--text)}
.game{display:grid;grid-template-columns:1fr 210px;gap:16px}
@media(max-width:760px){.game{grid-template-columns:1fr}.side{display:grid!important;grid-template-columns:1fr 1fr}}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
#prof{margin-top:8px;cursor:default;border-radius:8px}
.side{display:flex;flex-direction:column;gap:12px}
.ro{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ro .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.ro .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:2px}
.ro .v small{font-size:14px;color:var(--muted)}
.bar{position:relative;height:10px;border-radius:5px;background:#0b0d10;border:1px solid var(--line-2);overflow:hidden;margin-top:8px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok);transition:width .15s}
.legend{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px;background:linear-gradient(90deg,#787f88 0%,#5a3a36 40%,#9a1e14 55%,#d23c14 70%,#ff8c1e 85%,#ffe678)}
.legend-k{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px}
.controls{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.btn{padding:14px 20px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line-2);cursor:pointer;font-family:var(--font);background:transparent;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--orange);color:#1a0d05;border-color:transparent}
.btn.on{border-color:var(--orange);color:var(--orange-2)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
@media(max-width:760px){.levels{grid-template-columns:repeat(3,1fr)}}
.controls + .controls{margin-top:10px}
.modes{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.mode{padding:10px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font-family:var(--font);font-weight:700;font-size:15px;cursor:pointer}
.mode small{display:block;font-weight:500;font-size:12px;color:var(--dim);margin-top:2px}
.mode.on{border-color:var(--orange);background:var(--orange-soft)}
.mode.on small{color:var(--orange-2)}
.lv{position:relative;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);cursor:pointer;font-family:var(--font)}
.lv:hover{border-color:var(--muted)}
.lv .n{font-family:var(--mono);font-size:12px;color:var(--dim)}
.lv .t{display:block;font-weight:700;font-size:13px;margin-top:2px;line-height:1.25}
.lv .s{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:4px}
.lv.cur{border-color:var(--orange);background:var(--orange-soft)}
.lv.cur .n{color:var(--orange-2)}
.lv.done .s{color:var(--ok)}
.msg{min-height:50px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:15px;line-height:1.45}
.msg b{color:var(--orange-2)}
.msg.good{border-color:rgba(73,209,125,.5)} .msg.good b{color:var(--ok)}
.msg.bad{border-color:rgba(255,90,90,.5)} .msg.bad b{color:var(--bad)}
.help{color:var(--dim);font-size:13px;margin-top:14px;line-height:1.5}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,16,19,.86);border-radius:16px;text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{margin:0 0 6px;font-size:28px}
.overlay .score{font-family:var(--mono);font-size:52px;color:var(--orange-2);font-weight:600}
.overlay p{color:var(--muted);margin:6px 0 18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="./">← Zpět na web</a>
    <span style="font-family:var(--mono);color:var(--dim);font-size:13px">mini hra · Dawell DHI-191 HD</span>
  </header>

  <h1>Indukční ohřev s <span>DHI-191 HD</span></h1>
  <div class="modes" role="tablist">
    <button class="mode on" id="modePlate" role="tab">Rovnání plechu <small>fokus cívka</small></button>
    <button class="mode" id="modeBar" role="tab">Ohřev kulatiny <small>závitová cívka</small></button>
  </div>
  <p class="sub" id="sub"></p>

  <div class="levels" id="levels" aria-label="Výběr úrovně"></div>

  <div class="game">
    <div class="panel">
      <canvas id="cv" width="800" height="500" aria-label="Ocelový plech na pracovním stole a induktor"></canvas>
      <canvas id="prof" width="800" height="190" aria-label="Plech z boku s pravítkem"></canvas>
      <div class="overlay" id="over">
        <div>
          <h2 id="overTitle">Hotovo!</h2>
          <div class="score" id="overScore">0</div>
          <p id="overText"></p>
          <p id="autoNext" style="color:var(--orange-2);font-weight:600;margin-top:-6px"></p>
          <button class="btn pri" id="overBtn">Další úroveň</button>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="ro">
        <div class="k">Úroveň</div>
        <div class="v"><span id="lvl">1</span> <small>/ <span id="lvlCount">6</span></small></div>
        <div style="color:var(--muted);font-size:13px;margin-top:2px" id="lvlName"></div>
      </div>
      <div class="ro">
        <div class="k">Pod induktorem</div>
        <div class="v"><span id="tc">22</span> <small>°C</small></div>
      </div>
      <div class="ro">
        <div class="k" id="k3">Největší boule</div>
        <div class="v"><span id="mm">0,0</span> <small id="u3">mm</small></div>
        <div class="bar"><div class="fill" id="pctFill"></div></div>
      </div>
      <div class="ro">
        <div class="k" id="k4">Čas · spáleno</div>
        <div class="v"><span id="time">0,0</span><small> s · </small><span id="burnt">0</span></div>
      </div>
      <div class="ro">
        <div class="k">Barva žáru</div>
        <div class="legend"></div>
        <div class="legend-k"><span>20</span><span id="legMid">600–800</span><span>900 °C</span></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn pri" id="flip" title="Také klávesa O">⇅ Otočit plech <span id="sideLbl" style="font-family:var(--mono);font-size:12px;opacity:.75">(nahoře A)</span></button>
    <button class="btn" id="gauge">📏 Měřidlo boulí: vypnuto</button>
    <button class="btn on" id="field">⚡ Ukázat indukci: zapnuto</button>
    <button class="btn" id="restart">Začít úroveň znovu</button>
    <button class="btn" id="next">Další úroveň →</button>
  </div>
  <div class="msg" id="msg"></div>
  <p class="help" id="help"></p>
</div>

<script>
(() => {
  const W = 800, H = 500;
  const PX = 30, PY = 25, PW = 740, PH = 450;          // plech na stole
  const CELL = 5, GW = PW / CELL, GH = PH / CELL, N = GW * GH;
  const ROOM = 22, WORK_LO = 600, WORK_HI = 820, BURN = 900, FLAT = 1.0;
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const pv = $('prof'), pctx = pv.getContext('2d');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // vrstvy v rozlišení mřížky
  const shadeCv = mk(GW, GH), shadeCtx = shadeCv.getContext('2d'), shadeImg = shadeCtx.createImageData(GW, GH);
  const tintCv = mk(GW, GH), tintCtx = tintCv.getContext('2d'), tintImg = tintCtx.createImageData(GW, GH);
  const glowCv = mk(GW, GH), glowCtx = glowCv.getContext('2d'), glowImg = glowCtx.createImageData(GW, GH);
  const gaugeCv = mk(GW, GH), gaugeCtx = gaugeCv.getContext('2d'), gaugeImg = gaugeCtx.createImageData(GW, GH);
  const bloomCv = mk(GW / 5 | 0, GH / 5 | 0), bloomCtx = bloomCv.getContext('2d');

  // ---------- statické pozadí: svařovací stůl + broušený plech ----------
  const bgCv = mk(W, H), bg = bgCv.getContext('2d');
  (function buildBackground() {
    bg.fillStyle = '#24272b'; bg.fillRect(0, 0, W, H);
    for (let y = 12; y < H; y += 50) for (let x = 12; x < W; x += 50) {      // otvory v desce stolu
      bg.beginPath(); bg.arc(x, y, 7, 0, Math.PI * 2); bg.fillStyle = '#121416'; bg.fill();
      bg.beginPath(); bg.arc(x, y + 1, 7, 0.1, Math.PI - 0.1); bg.strokeStyle = 'rgba(255,255,255,.07)'; bg.stroke();
    }
    // stín plechu
    bg.fillStyle = 'rgba(0,0,0,.55)'; bg.fillRect(PX + 6, PY + 8, PW, PH);
    // textura oceli
    const img = bg.createImageData(PW, PH), d = img.data;
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let y = 0; y < PH; y++) {
      const row = (rnd() - .5) * 10;
      let run = 0;
      for (let x = 0; x < PW; x++) {
        run = run * 0.93 + (rnd() - .5) * 7;
        const mott = 7 * Math.sin(x / 95 + y / 150) + 5 * Math.sin(x / 41 - y / 67) + 3 * Math.sin((x + y) / 19);
        const v = 150 + row + run + mott + (rnd() - .5) * 6;
        const k = (y * PW + x) * 4;
        d[k] = v - 5; d[k + 1] = v; d[k + 2] = v + 6; d[k + 3] = 255;
      }
    }
    bg.putImageData(img, PX, PY);
    // odlesk (dílenské světlo)
    const g = bg.createLinearGradient(PX, PY, PX + PW, PY + PH);
    g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(.35, 'rgba(255,255,255,.02)');
    g.addColorStop(.5, 'rgba(255,255,255,.16)'); g.addColorStop(.62, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.18)');
    bg.fillStyle = g; bg.fillRect(PX, PY, PW, PH);
    // škrábance
    for (let i = 0; i < 40; i++) {
      const x = PX + rnd() * PW, y = PY + rnd() * PH, l = 20 + rnd() * 90, a = (rnd() - .5) * .5;
      bg.strokeStyle = `rgba(255,255,255,${.04 + rnd() * .07})`; bg.lineWidth = .7;
      bg.beginPath(); bg.moveTo(x, y); bg.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); bg.stroke();
    }
    // hrany plechu (tloušťka)
    bg.fillStyle = '#5d6168'; bg.fillRect(PX, PY + PH, PW, 4);
    bg.fillStyle = '#6c7078'; bg.fillRect(PX + PW, PY, 4, PH + 4);
    bg.strokeStyle = 'rgba(255,255,255,.35)'; bg.lineWidth = 1;
    bg.beginPath(); bg.moveTo(PX, PY + PH); bg.lineTo(PX, PY + .5); bg.lineTo(PX + PW, PY + .5); bg.stroke();
  })();

  // ---------- úrovně ----------
  const LEVELS = [
    { name: 'Jedna promáčklina', bumps: [{ x: 400, y: 250, r: 60, h: 5 }] },
    { name: 'Prohnutý pás', bumps: [{ x: 250, y: 250, r: 45, h: 3.5 }, { x: 330, y: 250, r: 45, h: 4 }, { x: 410, y: 250, r: 45, h: 4.5 }, { x: 490, y: 250, r: 45, h: 4 }, { x: 570, y: 250, r: 45, h: 3.5 }] },
    { name: 'Dvě promáčkliny', bumps: [{ x: 230, y: 170, r: 55, h: 5 }, { x: 570, y: 330, r: 65, h: 6 }] },
    { name: 'Tři různé promáčkliny', bumps: [{ x: 200, y: 330, r: 40, h: 3 }, { x: 420, y: 150, r: 55, h: 5 }, { x: 610, y: 320, r: 70, h: 6.5 }] },
    { name: 'Velká promáčklina', bumps: [{ x: 400, y: 250, r: 105, h: 6 }] },
    { name: 'Zvlněný okraj', bumps: [80, 180, 280, 380, 480, 580, 680].map((x, n) => ({ x: x + 20, y: 85, r: 45, h: 3 + (n % 2) * 1.5 })) },
    { name: 'Boule nahoru – otoč plech', bumps: [{ x: 400, y: 250, r: 70, h: -5 }] },
    { name: 'Nahoru i dolů', bumps: [{ x: 250, y: 190, r: 55, h: 4.5 }, { x: 550, y: 310, r: 60, h: -5 }] },
    { name: 'Dlouhý ohyb', bumps: [{ t: 'ridge', x0: 160, x1: 640, y: 250, w: 17, h: 4.5 }] },
  ];
  // kulatina: průměr (px ≈ mm), úseky k ohřevu na teplotu pro ohýbání
  const BAR_LEVELS = [
    { name: 'Krátký úsek', d: 40, zones: [[340, 460]] },
    { name: 'Dlouhý úsek', d: 40, zones: [[230, 570]] },
    { name: 'Silná kulatina', d: 70, zones: [[330, 470]] },
    { name: 'Dva úseky', d: 40, zones: [[170, 280], [520, 630]] },
  ];
  let mode = 'plate';
  const LV = () => (mode === 'bar' ? BAR_LEVELS : LEVELS);

  // h > 0 = boule nahoru (vypouklá shora), h < 0 = prohnutí dolů (vypouklé zespodu)
  function bumpAt(b, px, py) {
    if (b.t === 'ridge') {
      const s = Math.min(1, Math.max(0, (px - b.x0) / 50), Math.max(0, (b.x1 - px) / 50));
      return b.h * s * s * (3 - 2 * s) * Math.exp(-((py - b.y) ** 2) / (2 * b.w * b.w));
    }
    return b.h * Math.exp(-((px - b.x) ** 2 + (py - b.y) ** 2) / (2 * (b.r / 1.6) ** 2));
  }

  let T, T2, D, P, Tmax, D0max, lvl = 0, time, done, coil, grab, last, showGauge = false, tcNow = ROOM;
  let smoke = [], flipped = false;

  const TEXTS = {
    plate: {
      sub: '<b>Chyť fokus cívku myší (nebo prstem) a ohřívej nerovná místa.</b> Dokud ji držíš, soustředí pole do malé plochy a ocel tam rychle zčervená. Místo rozžhavené do třešňově červené (cca 600–800 °C) se při chladnutí smrští a plech se srovná. <b>Rovná se z druhé strany – z vyduté</b>: promáčklinu ohříváš rovnou, ale bouli nahoru musíš nejdřív <b>otočit</b>. Nad 900 °C plech spálíš.',
      help: 'Boule poznáš podle odlesků na plechu a podle pohledu z boku dole; tlačítkem Měřidlo boulí si zapneš vrstevnice po 1 mm. Po ohřevu zůstanou na oceli náběhové barvy – slámová, fialová, modrá – stejně jako ve skutečnosti. Úroveň splníš, když žádná nerovnost nebude větší než 1 mm. Skutečný Dawell DHI-191 HD má 19 kW a kapalinou chlazený induktor, takže může pracovat nepřetržitě.',
    },
    bar: {
      sub: '<b>Chyť závitovou cívku a posouvej ji po kulatině.</b> Cívka obepíná kulatinu dokola a ohřívá ji celým průřezem. Ohřej vyznačené úseky na <b>750–900 °C</b> (oranžový žár) – na tuhle teplotu se kulatina ohýbá. Úsek delší než cívka musíš prohřát postupně, posouváním tam a zpět. Silnější kulatina se ohřívá pomaleji. Nad 1000 °C materiál přehřeješ.',
      help: 'Graf dole ukazuje teplotu po celé délce kulatiny, zelený pás je cílových 750–900 °C. Úsek se odškrtne, když je skoro celý v tomto rozmezí najednou. Teplo se po kulatině rozlévá do stran a pomalu chladne.',
    },
  };

  function startLevel() {
    if (typeof autoTimer !== 'undefined' && autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    time = 0; done = false; grab = false; smoke = [];
    $('over').classList.remove('show');
    $('lvl').textContent = lvl + 1; $('lvlName').textContent = LV()[lvl].name;
    $('lvlCount').textContent = LV().length;
    $('sub').innerHTML = TEXTS[mode].sub; $('help').textContent = TEXTS[mode].help;
    $('modePlate').classList.toggle('on', mode === 'plate'); $('modeBar').classList.toggle('on', mode === 'bar');
    $('flip').style.display = $('gauge').style.display = mode === 'plate' ? '' : 'none';
    $('k3').textContent = mode === 'plate' ? 'Největší nerovnost' : 'Úseky ohřáté';
    $('u3').textContent = mode === 'plate' ? 'mm' : '';
    $('k4').textContent = mode === 'plate' ? 'Čas · spáleno' : 'Čas · přehřáto';
    $('legMid').textContent = mode === 'plate' ? '600–800' : '750–900';
    if (typeof renderLevels === 'function') renderLevels();
    if (mode === 'bar') { barStart(); return; }
    T = new Float32Array(N).fill(ROOM); T2 = new Float32Array(N);
    D = new Float32Array(N); P = new Float32Array(N); Tmax = new Float32Array(N).fill(ROOM);
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const px = PX + i * CELL + CELL / 2, py = PY + j * CELL + CELL / 2; let h = 0;
      for (const b of LEVELS[lvl].bumps) h -= bumpAt(b, px, py);   // kladné h v úrovni = promáčklina shora
      D[j * GW + i] = h;
    }
    D0max = 0; for (let k = 0; k < N; k++) D0max = Math.max(D0max, Math.abs(D[k]));
    coil = { x: 120, y: 400, tx: 120, ty: 400, on: 0, lift: 0 }; flipped = false;
    $('sideLbl').textContent = '(nahoře A)';
    setMsg(`Úroveň ${lvl + 1}: <b>${LEVELS[lvl].name}</b>. Chyť fokus cívku a vyrovnej plech – ohřívej z vyduté strany.`);
  }
  function setMsg(h, c) { $('msg').innerHTML = h; $('msg').className = 'msg' + (c ? ' ' + c : ''); }

  // ---------- ovládání ----------
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  cv.addEventListener('pointerdown', e => {
    if (done) return;
    const p = pos(e);
    const near = mode === 'bar' ? Math.abs(p.x - coil.x) < 80 && Math.abs(p.y - coil.y) < 140 : Math.hypot(p.x - coil.x, p.y - coil.y) < 90;
    if (near || e.pointerType === 'touch') {
      grab = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} cv.classList.add('drag');
      moveTo(p);
    }
  });
  function moveTo(p) {
    if (mode === 'bar') { coil.tx = Math.max(BAR_X0 + 30, Math.min(BAR_X1 - 30, p.x)); return; }
    coil.tx = Math.max(PX, Math.min(PX + PW, p.x)); coil.ty = Math.max(PY, Math.min(PY + PH, p.y));
  }
  cv.addEventListener('pointermove', e => { if (grab) moveTo(pos(e)); });
  const drop = () => { grab = false; cv.classList.remove('drag'); };
  cv.addEventListener('pointerup', drop); cv.addEventListener('pointercancel', drop); addEventListener('blur', drop);

  // otočení plechu (překlopení kolem vodorovné osy): boule nahoru ↔ dolů, nahoře je druhá strana
  function flipPlate() {
    if (done || mode !== 'plate') return;
    const mirror = (a, neg) => {
      for (let j = 0; j < GH / 2; j++) for (let i = 0; i < GW; i++) {
        const k = j * GW + i, k2 = (GH - 1 - j) * GW + i, t = a[k]; a[k] = a[k2]; a[k2] = t;
      }
      if (neg) for (let k = 0; k < N; k++) a[k] = -a[k];
    };
    mirror(D, true); mirror(P, true); mirror(T, false); mirror(Tmax, false);
    flipped = !flipped; smoke = []; drop();
    $('sideLbl').textContent = `(nahoře ${flipped ? 'B' : 'A'})`;

  { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;

    pctx.strokeStyle = 'rgba(73,209,125,.5)'; pctx.setLineDash([6, 6]); pctx.lineWidth = 1;
    pctx.beginPath(); pctx.moveTo(PX, BASE); pctx.lineTo(PX + PW, BASE); pctx.moveTo(PX, BASE + THICK); pctx.lineTo(PX + PW, BASE + THICK); pctx.stroke(); pctx.setLineDash([]);

    // ocelové pravítko – položí se na plech, když induktor pustíš (leží na nejvyšším místě)
    const ruler = coil.lift, ry = BASE - maxD * SC, ok = Math.max(maxD, maxDn) <= FLAT;
    if (ruler > .05) {
      pctx.save(); pctx.globalAlpha = ruler;
      // světlo prosvítající mezerou pod pravítkem
      pctx.beginPath(); pctx.moveTo(PX, ry);
      for (let i = 0; i < GW; i++) pctx.lineTo(xAt(i), yTop(i));
      pctx.lineTo(PX + PW, ry); pctx.closePath();
      const lg = pctx.createLinearGradient(0, ry, 0, ry + 26);
      lg.addColorStop(0, 'rgba(255,244,210,.55)'); lg.addColorStop(1, 'rgba(255,244,210,0)');
      pctx.fillStyle = lg; pctx.fill();
      pctx.fillStyle = 'rgba(255,248,225,.95)'; pctx.fillRect(PX, ry, PW, 1.5);
      const rg = pctx.createLinearGradient(0, ry - 16, 0, ry);
      rg.addColorStop(0, '#eef0f2'); rg.addColorStop(.5, '#b6bbc2'); rg.addColorStop(1, '#7d838b');
      pctx.fillStyle = rg; pctx.fillRect(PX - 10, ry - 16, PW + 20, 16);
      pctx.fillStyle = '#3d4249';
      for (let x = PX; x <= PX + PW; x += 10) pctx.fillRect(x, ry - 16, 1, (x - PX) % 50 === 0 ? 7 : 4);
      pctx.restore();
    }

    // kóty: boule nahoru (nad horní rovinou) a prohnutí dolů (pod spodní rovinou)
    const dim = (mx, y1, y2, val, good) => {
      pctx.strokeStyle = good ? '#49D17D' : '#FF9254'; pctx.lineWidth = 1.5;
      pctx.beginPath(); pctx.moveTo(mx, y1); pctx.lineTo(mx, y2); pctx.stroke();
      pctx.beginPath(); pctx.moveTo(mx - 4, y1 + 5); pctx.lineTo(mx, y1); pctx.lineTo(mx + 4, y1 + 5); pctx.stroke();
      pctx.beginPath(); pctx.moveTo(mx - 4, y2 - 5); pctx.lineTo(mx, y2); pctx.lineTo(mx + 4, y2 - 5); pctx.stroke();
      pctx.font = '600 11px JetBrains Mono, monospace'; pctx.textAlign = 'right'; pctx.fillStyle = good ? '#49D17D' : '#FF9254';
      pctx.fillText(val.toFixed(1).replace('.', ',') + ' mm', mx - 6, (y1 + y2) / 2 + 4);
    };
    if (maxD > 0.15) dim(xAt(maxI) - 10, ry + 2, BASE - 2, maxD, maxD <= FLAT);
    if (maxDn > 0.15) dim(xAt(dnI) - 10, BASE + THICK + 2, BASE + THICK + maxDn * SC - 2, maxDn, maxDn <= FLAT);

    // induktor z boku nad plechem (když ho držíš)
    const ix = coil.x, lift = 4 + coil.lift * 14, iy = Math.max(62, BASE - (colD[Math.max(0, Math.min(GW - 1, ((ix - PX) / CELL) | 0))] || 0) * SC - lift);
    pctx.save(); pctx.globalAlpha = 1 - coil.lift;
    if (coil.on > .05) {
      const hg = pctx.createRadialGradient(ix, iy + lift, 2, ix, iy + lift, 60);
      hg.addColorStop(0, `rgba(255,130,50,${.35 * coil.on})`); hg.addColorStop(1, 'rgba(255,130,50,0)');
      pctx.fillStyle = hg; pctx.fillRect(ix - 60, iy - 50, 120, 110);
    }
    // fokusačka z boku: feritový blok se závity a hrot nad plechem
    const fg2 = pctx.createLinearGradient(ix - 20, 0, ix + 20, 0);
    fg2.addColorStop(0, '#2a2d32'); fg2.addColorStop(.5, '#4a4e55'); fg2.addColorStop(1, '#1a1c1f');
    pctx.fillStyle = fg2; pctx.beginPath(); pctx.roundRect(ix - 20, iy - 30, 40, 26, 4); pctx.fill();
    pctx.beginPath(); pctx.moveTo(ix - 10, iy - 4); pctx.lineTo(ix + 10, iy - 4); pctx.lineTo(ix + 4, iy + 2); pctx.lineTo(ix - 4, iy + 2); pctx.closePath(); pctx.fill();
    for (const x of [-14, -6, 2, 10]) { pctx.fillStyle = '#b5622c'; pctx.fillRect(ix + x, iy - 31, 4, 28); pctx.fillStyle = 'rgba(255,210,170,.6)'; pctx.fillRect(ix + x, iy - 31, 1.3, 28); }
    pctx.fillStyle = '#b5622c'; pctx.fillRect(ix + 18, iy - 26, 16, 5);                        // přívody k pistoli
    pctx.save(); pctx.translate(ix + 32, iy - 26); pctx.rotate(-0.15);
    const bg2 = pctx.createLinearGradient(0, -12, 0, 12);
    bg2.addColorStop(0, '#ffa066'); bg2.addColorStop(1, '#c94e10');
    pctx.fillStyle = '#121315'; pctx.fillRect(0, -9, 14, 18);
    pctx.fillStyle = bg2; pctx.beginPath(); pctx.roundRect(14, -12, 60, 24, 7); pctx.fill();
    pctx.fillStyle = '#1d1f23'; pctx.beginPath(); pctx.roundRect(72, -10, 32, 20, 6); pctx.fill();
    pctx.restore();
    pctx.restore();

    // popisky
    pctx.font = '600 11px JetBrains Mono, monospace'; pctx.textAlign = 'left'; pctx.textBaseline = 'alphabetic';
    pctx.fillStyle = '#9BA4B0'; pctx.fillText('POHLED Z BOKU · převýšeno 8× · pusť fokus cívku = přiložit pravítko', PX, 16);
    pctx.textAlign = 'right';
    pctx.fillStyle = ok ? '#49D17D' : '#FF9254';
    pctx.fillText(ok ? 'ROVNÝ ✓' : `nerovnost ${Math.max(maxD, maxDn).toFixed(1).replace('.', ',')} mm`, PX + PW, 16);
  }

  function draw(now, dt) {
    buildLayers();
    ctx.drawImage(bgCv, 0, 0);
    ctx.imageSmoothingEnabled = true;
    const blur = px => { if (FILTER) ctx.filter = px ? `blur(${px}px)` : 'none'; };
    ctx.save();
    ctx.beginPath(); ctx.rect(PX, PY, PW, PH); ctx.clip();               // nic nepřeteče mimo plech
    ctx.globalCompositeOperation = 'overlay'; blur(2); ctx.drawImage(shadeCv, PX, PY, PW, PH);
    ctx.globalCompositeOperation = 'source-over'; blur(3.5); ctx.drawImage(tintCv, PX, PY, PW, PH);
    blur(1.5); ctx.drawImage(gaugeCv, PX, PY, PW, PH);
    ctx.globalCompositeOperation = 'lighter';
    blur(2.5); ctx.drawImage(glowCv, PX, PY, PW, PH);
    if (FILTER) { blur(18); ctx.globalAlpha = .75; ctx.drawImage(glowCv, PX, PY, PW, PH); }
    else { ctx.globalAlpha = .7; ctx.drawImage(bloomCv, PX - 12, PY - 12, PW + 24, PH + 24); }
    ctx.globalAlpha = 1; blur(0);
    ctx.restore();
    // žár prosvítí i okolí (záře na stole a na induktoru)
    if (tcNow > 520) {
      const a = Math.min(1, (tcNow - 520) / 400) * .22;
      const g = ctx.createRadialGradient(coil.x, coil.y, 10, coil.x, coil.y, 160);
      g.addColorStop(0, `rgba(255,120,40,${a})`); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(coil.x - 160, coil.y - 160, 320, 320);
      ctx.globalCompositeOperation = 'source-over';
    }
    if (showField) drawInduction(now);
    drawInductor(now);
    drawSmoke(dt);
    // vinětace – dílenské světlo shora
    const vg = ctx.createRadialGradient(W * .45, H * .4, 120, W * .5, H * .5, 560);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (!grab && time === 0) {
      ctx.font = '700 15px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgba(14,16,19,.75)'; ctx.beginPath(); ctx.roundRect(coil.x - 92, coil.y - 92, 184, 28, 8); ctx.fill();
      ctx.fillStyle = '#EEF0F3'; ctx.fillText('chyť fokus cívku a táhni ↓', coil.x, coil.y - 73);
    }
    drawProfile();
  }

  function update(dt) {
    coil.x += (coil.tx - coil.x) * Math.min(1, dt * 14);
    coil.y += (coil.ty - coil.y) * Math.min(1, dt * 14);
    coil.lift += ((grab ? 0 : 1) - coil.lift) * Math.min(1, dt * 8);
    const sub = Math.max(2, Math.ceil(DIFF / (CELL * CELL) * dt / 0.2));
    for (let s = 0; s < sub; s++) step(dt / sub);
    if (grab || time > 0) time += dt;

    let nb = 0, mx = 0, tc = 0;
    for (let k = 0; k < N; k++) { if (Tmax[k] > BURN) nb++; const ad = Math.abs(D[k]); if (ad > mx) mx = ad; }
    const ci = ((coil.x - PX) / CELL) | 0, cj = ((coil.y - PY) / CELL) | 0;
    for (let b = -6; b <= 6; b++) for (let a = -6; a <= 6; a++) {
      const i = ci + a, j = cj + b;
      if (i >= 0 && i < GW && j >= 0 && j < GH) tc = Math.max(tc, T[j * GW + i]);
    }
    tcNow = tc;
    $('tc').textContent = Math.round(tc);
    $('tc').style.color = tc >= WORK_LO && tc <= WORK_HI ? 'var(--ok)' : tc > WORK_HI ? 'var(--bad)' : '';
    $('mm').textContent = mx.toFixed(1).replace('.', ',');
    $('mm').style.color = mx <= FLAT ? 'var(--ok)' : '';
    $('pctFill').style.width = Math.max(0, Math.min(100, (1 - (mx - FLAT) / (D0max - FLAT)) * 100)) + '%';
    $('time').textContent = time.toFixed(1).replace('.', ',');
    $('burnt').textContent = nb; $('burnt').style.color = nb ? 'var(--bad)' : '';

    if (!done && grab) {
      let under = 0;
      for (let b = -3; b <= 3; b++) for (let a = -3; a <= 3; a++) {
        const i = ci + a, j = cj + b;
        if (i >= 0 && i < GW && j >= 0 && j < GH) { const d = D[j * GW + i]; if (Math.abs(d) > Math.abs(under)) under = d; }
      }
      if (under > 0.4 && tc > 400) setMsg('<b>Ohříváš z vypouklé strany!</b> Boule se tím ještě zvětší. Rovná se z druhé, vyduté strany – <b>otoč plech</b>.', 'bad');
      else if (tc > WORK_HI + 30) setMsg('<b>Pozor, moc žhavé!</b> Posuň fokus cívku, ať plech nespálíš.', 'bad');
      else if (tc >= WORK_LO) setMsg('<b>Třešňově červená</b> – ideální teplota. Popojeď dál; místo se stáhne, až vychladne.');
      else setMsg('Ohříváš… drž fokus cívku nad promáčklinou, až ocel zčervená.');
    }
    if (!done && !grab && time > 0) {
      let pend = 0; for (let k = 0; k < N; k++) pend += P[k];
      if (Math.abs(pend) > 0.5) setMsg('Ocel chladne a <b>stahuje se</b> – sleduj, jak se plech rovná.');
    }
    if (!done && mx <= FLAT) win(nb);
  }

  // ================= KULATINA + ZÁVITOVÁ CÍVKA =================
  const BAR_X0 = 50, BAR_X1 = 750, BAR_Y = 235, BC = 5, BN = (BAR_X1 - BAR_X0) / BC;
  const BAR_LO = 750, BAR_HI = 920, BAR_BURN = 1000, COIL_HALF = 42;
  const BT = new Float32Array(BN), BT2 = new Float32Array(BN), BTmax = new Float32Array(BN);
  let bar = BAR_LEVELS[0], zoneDone = [], zoneFrac = [];
  const barBg = mk(W, H);
  (function buildBarBackground() {
    const b = barBg.getContext('2d');
    b.drawImage(bgCv, 0, 0);                                        // stůl s otvory
    b.fillStyle = '#24272b'; b.fillRect(PX - 2, PY - 2, PW + 12, PH + 14);  // bez plechu
    for (let y = 12; y < H; y += 50) for (let x = 12; x < W; x += 50) {
      b.beginPath(); b.arc(x, y, 7, 0, Math.PI * 2); b.fillStyle = '#121416'; b.fill();
      b.beginPath(); b.arc(x, y + 1, 7, 0.1, Math.PI - 0.1); b.strokeStyle = 'rgba(255,255,255,.07)'; b.stroke();
    }
  })();
  function barStart() {
    bar = BAR_LEVELS[lvl]; BT.fill(ROOM); BTmax.fill(ROOM);
    zoneDone = bar.zones.map(() => false); zoneFrac = bar.zones.map(() => 0);
    coil = { x: 130, y: BAR_Y, tx: 130, ty: BAR_Y, on: 0, lift: 0 };
    setMsg(`Úroveň ${lvl + 1}: <b>${bar.name}</b> (Ø ${bar.d} mm). Chyť závitovou cívku a ohřej vyznačené úseky na 750–900 °C.`);
  }
  function barStep(dt) {
    coil.on += ((grab ? 1 : 0) - coil.on) * Math.min(1, dt / 0.1);
    const k = 40 / bar.d, rate = 130 * Math.pow(k, 1.3);           // silnější kulatina = víc materiálu = pomalejší ohřev
    for (let i = 0; i < BN; i++) {
      const u = Math.abs(BAR_X0 + i * BC + 2.5 - coil.x);
      const q = Math.max(0, Math.min(1, (COIL_HALF + 6 - u) / 12));
      if (q > 0) BT[i] += rate * coil.on * q * dt;
    }
    const c = 45 / (BC * BC) * dt;
    for (let i = 0; i < BN; i++) {
      const t = BT[i], l = i ? BT[i - 1] : t, r = i < BN - 1 ? BT[i + 1] : t;
      const loss = (0.003 + 0.000007 * (t - ROOM)) * k * (t - ROOM);   // vyzařování roste s teplotou (pár °C/s)
      BT2[i] = t + c * (l + r - 2 * t) - loss * dt;
      if (BT2[i] > BTmax[i]) BTmax[i] = BT2[i];
    }
    BT.set(BT2);
  }
  function barUpdate(dt) {
    coil.x += (coil.tx - coil.x) * Math.min(1, dt * 12);
    coil.lift += ((grab ? 0 : 1) - coil.lift) * Math.min(1, dt * 8);
    const sub = 3; for (let s = 0; s < sub; s++) barStep(dt / sub);
    if (grab || time > 0) time += dt;
    let tc = 0, nb = 0;
    for (let i = 0; i < BN; i++) {
      if (BTmax[i] > BAR_BURN) nb++;
      if (Math.abs(BAR_X0 + i * BC + 2.5 - coil.x) < COIL_HALF) tc = Math.max(tc, BT[i]);
    }
    tcNow = tc;
    bar.zones.forEach(([x0, x1], z) => {
      let n = 0, ok = 0;
      for (let i = 0; i < BN; i++) { const x = BAR_X0 + i * BC + 2.5; if (x >= x0 && x <= x1) { n++; if (BT[i] >= BAR_LO && BT[i] <= BAR_HI) ok++; } }
      zoneFrac[z] = ok / n;
      if (!zoneDone[z] && zoneFrac[z] >= 0.92) { zoneDone[z] = true; if (bar.zones.length > 1) setMsg(`<b>Úsek ${z + 1} prohřátý ✓</b> – teď ten další.`, 'good'); }
    });
    const nd = zoneDone.filter(Boolean).length;
    $('tc').textContent = Math.round(tc);
    $('tc').style.color = tc >= BAR_LO && tc <= BAR_HI ? 'var(--ok)' : tc > BAR_HI ? 'var(--bad)' : '';
    $('mm').textContent = `${nd} / ${bar.zones.length}`;
    $('mm').style.color = nd === bar.zones.length ? 'var(--ok)' : '';
    const prog = bar.zones.reduce((a, _, z) => a + (zoneDone[z] ? 1 : zoneFrac[z]), 0) / bar.zones.length;
    $('pctFill').style.width = Math.round(prog * 100) + '%';
    $('time').textContent = time.toFixed(1).replace('.', ',');
    $('burnt').textContent = nb; $('burnt').style.color = nb ? 'var(--bad)' : '';
    if (!done && grab) {
      if (tc > BAR_BURN - 50) setMsg('<b>Pozor, přehříváš!</b> Posuň cívku dál po kulatině.', 'bad');
      else if (tc >= BAR_LO) setMsg('<b>Oranžový žár</b> – správná teplota. Posouvej cívku po celém úseku, ať je prohřátý celý.');
      else setMsg('Ohříváš… kulatina se prohřívá celým průřezem, chvíli to trvá.');
    }
    if (!done && nd === bar.zones.length) win(nb);
  }

  function barDraw(now, dt) {
    const R = bar.d / 2, Rc = R + 10, top = BAR_Y - R, cx = coil.x, on = coil.on;
    const blur = px => { if (FILTER) ctx.filter = px ? `blur(${px}px)` : 'none'; };
    ctx.drawImage(barBg, 0, 0);
    // podpěry pod kulatinou
    for (const sx of [120, 680]) {
      const g = ctx.createLinearGradient(sx - 30, 0, sx + 30, 0);
      g.addColorStop(0, '#3e4248'); g.addColorStop(.5, '#6a6f77'); g.addColorStop(1, '#2e3136');
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(sx - 26, BAR_Y + R - 4, 62, H - BAR_Y - R - 30);
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(sx - 32, BAR_Y + R - 6); ctx.lineTo(sx - 10, BAR_Y + R + 8); ctx.lineTo(sx + 10, BAR_Y + R + 8); ctx.lineTo(sx + 32, BAR_Y + R - 6);
      ctx.lineTo(sx + 32, H - 40); ctx.lineTo(sx - 32, H - 40); ctx.closePath(); ctx.fill();
    }
    // stín kulatiny
    ctx.save(); blur(8); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(BAR_X0 + 10, BAR_Y + R + 4, BAR_X1 - BAR_X0, 16); ctx.restore();

    // cívka – zadní půlky závitů (za kulatinou)
    const turns = 8, tube = (draw, w, col) => {
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#2a1206'; ctx.lineWidth = w + 2.2; draw(); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = w; draw(); ctx.stroke();
    };
    const hot = Math.max(0, Math.min(1, (tcNow - 500) / 400));
    for (let n = 0; n < turns; n++) {
      const x = cx - COIL_HALF + n * (2 * COIL_HALF / (turns - 1));
      tube(() => { ctx.beginPath(); ctx.ellipse(x, BAR_Y, 5, Rc, 0.14, -Math.PI / 2, Math.PI / 2); }, 4.2, '#7a3d18');
    }

    // kulatina – válec se světlem shora
    ctx.save(); ctx.beginPath(); ctx.rect(BAR_X0, top, BAR_X1 - BAR_X0, 2 * R); ctx.clip();
    const cg = ctx.createLinearGradient(0, top, 0, top + 2 * R);
    cg.addColorStop(0, '#4b5057'); cg.addColorStop(.22, '#d5d9de'); cg.addColorStop(.38, '#a4aab2');
    cg.addColorStop(.75, '#5f646c'); cg.addColorStop(1, '#2c2f34');
    ctx.fillStyle = cg; ctx.fillRect(BAR_X0, top, BAR_X1 - BAR_X0, 2 * R);
    for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(255,255,255,${.03 + (i % 5) * .01})`; ctx.fillRect(BAR_X0, top + (i * 7.3) % (2 * R), BAR_X1 - BAR_X0, .6); }
    // náběhové barvy a okuje podle nejvyšší teploty
    for (let i = 0; i < BN; i++) {
      const tc = TEMPER[Math.min(1200, BTmax[i] | 0)];
      if (tc[3] > .01) { ctx.fillStyle = `rgba(${tc[0] | 0},${tc[1] | 0},${tc[2] | 0},${tc[3] * .85})`; ctx.fillRect(BAR_X0 + i * BC, top, BC + .5, 2 * R); }
    }
    // žár
    ctx.globalCompositeOperation = 'lighter';
    const drawGlow = () => {
      for (let i = 0; i < BN; i++) {
        const gc = GLOW[Math.max(0, Math.min(1200, BT[i] | 0))];
        if (gc[3] > .01) {
          const gg = ctx.createLinearGradient(0, top, 0, top + 2 * R);
          const c = `${gc[0] | 0},${gc[1] | 0},${gc[2] | 0}`;
          gg.addColorStop(0, `rgba(${c},${gc[3] * .55})`); gg.addColorStop(.3, `rgba(${c},${gc[3]})`); gg.addColorStop(1, `rgba(${c},${gc[3] * .6})`);
          ctx.fillStyle = gg; ctx.fillRect(BAR_X0 + i * BC - .5, top, BC + 1, 2 * R);
        }
      }
    };
    blur(2); drawGlow(); blur(0);
    ctx.restore();
    // záře kolem žhavé kulatiny
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; blur(14); ctx.globalAlpha = .55;
    for (let i = 0; i < BN; i += 2) {
      const gc = GLOW[Math.max(0, Math.min(1200, BT[i] | 0))];
      if (gc[3] > .05) { ctx.fillStyle = `rgba(${gc[0] | 0},${gc[1] | 0},${gc[2] | 0},${gc[3] * .6})`; ctx.fillRect(BAR_X0 + i * BC - 4, top - 10, BC * 2 + 8, 2 * R + 20); }
    }
    ctx.restore();
    // čelo kulatiny vpravo
    ctx.fillStyle = '#8b9199'; ctx.beginPath(); ctx.ellipse(BAR_X1, BAR_Y, 6, R, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();

    // úseky k ohřevu – křídové značky
    bar.zones.forEach(([x0, x1], z) => {
      const okz = zoneDone[z];
      ctx.strokeStyle = okz ? 'rgba(73,209,125,.95)' : 'rgba(245,245,240,.85)'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(x0, top - 16); ctx.lineTo(x0, top + 2 * R + 16); ctx.moveTo(x1, top - 16); ctx.lineTo(x1, top + 2 * R + 16); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '700 13px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = okz ? '#49D17D' : '#EEF0F3';
      ctx.fillText(`úsek ${z + 1}${okz ? ' ✓' : ` · ${Math.round(zoneFrac[z] * 100)} %`}`, (x0 + x1) / 2, top + 2 * R + 36);
    });

    // indukce: siločáry solenoidu a vířivé proudy po obvodu kulatiny
    if (showField && on > .05) {
      ctx.save(); ctx.setLineDash([8, 7]); ctx.lineDashOffset = -now / 30; ctx.lineWidth = 1.2;
      ctx.strokeStyle = `rgba(150,215,255,${.22 * on})`;
      for (const s of [1, 1.6]) { ctx.beginPath(); ctx.ellipse(cx, BAR_Y, COIL_HALF * s + 20, Rc * s + 14, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.lineDashOffset = -now / 25; ctx.strokeStyle = `rgba(150,215,255,${.3 * on})`;
      for (let x = cx - COIL_HALF + 6; x <= cx + COIL_HALF - 6; x += 12) { ctx.beginPath(); ctx.moveTo(x, top + 3); ctx.lineTo(x, top + 2 * R - 3); ctx.stroke(); }
      ctx.restore();
    }

    // cívka – přední půlky závitů, přívody a pistole
    const cop = `rgb(${170 + hot * 55},${90 + hot * 30},${45})`;
    for (let n = 0; n < turns; n++) {
      const x = cx - COIL_HALF + n * (2 * COIL_HALF / (turns - 1));
      tube(() => { ctx.beginPath(); ctx.ellipse(x, BAR_Y, 5, Rc, 0.14, Math.PI / 2, Math.PI * 1.5); }, 4.6, cop);
      ctx.strokeStyle = 'rgba(255,215,175,.8)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(x - 1, BAR_Y, 5, Rc, 0.14, Math.PI * 1.05, Math.PI * 1.35); ctx.stroke();
    }
    const gy = BAR_Y - Rc - 70;
    tube(() => { ctx.beginPath(); ctx.moveTo(cx - COIL_HALF, BAR_Y - Rc); ctx.lineTo(cx - COIL_HALF, gy + 6); ctx.lineTo(cx - 10, gy + 6); }, 4.6, cop);
    tube(() => { ctx.beginPath(); ctx.moveTo(cx + COIL_HALF, BAR_Y - Rc); ctx.lineTo(cx + COIL_HALF, gy + 16); ctx.lineTo(cx - 10, gy + 16); }, 4.6, cop);
    // hadice
    const rearX = cx + 160;
    for (const off of [-8, 0, 8]) {
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(rearX, gy + 11 + off); ctx.bezierCurveTo(rearX + 80, gy + off, W - 60, 40, W + 40, 20 + off);
      ctx.strokeStyle = '#08090a'; ctx.lineWidth = off ? 11 : 13; ctx.stroke();
      ctx.strokeStyle = '#1c1e21'; ctx.lineWidth = off ? 9.5 : 11.5; ctx.stroke();
    }
    ctx.save(); ctx.translate(cx - 22, gy + 11);
    ctx.fillStyle = '#121315'; ctx.beginPath(); ctx.roundRect(0, -14, 22, 28, 4); ctx.fill();
    const body = ctx.createLinearGradient(0, -18, 0, 18);
    body.addColorStop(0, '#ffa066'); body.addColorStop(.35, '#ff7a33'); body.addColorStop(1, '#c94e10');
    ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(20, -18, 76, 36, 10); ctx.fill();
    const grip = ctx.createLinearGradient(0, -16, 0, 16);
    grip.addColorStop(0, '#3a3d42'); grip.addColorStop(.4, '#24262a'); grip.addColorStop(1, '#0f1012');
    ctx.fillStyle = grip; ctx.beginPath(); ctx.roundRect(92, -16, 90, 32, 9); ctx.fill();
    ctx.fillStyle = '#1b1c1f'; ctx.fillRect(20, -3, 76, 6);
    ctx.fillStyle = '#fff'; ctx.font = '800 9px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('DAWELL', 56, -9.5); ctx.textBaseline = 'alphabetic';
    ctx.beginPath(); ctx.arc(84, 10, 3, 0, Math.PI * 2); ctx.fillStyle = on > .5 ? '#7dff9a' : '#2f3a33'; ctx.fill();
    ctx.restore();
    if (grab) { ctx.strokeStyle = 'rgba(255,146,84,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(cx - COIL_HALF - 12, BAR_Y - Rc - 8, 2 * COIL_HALF + 24, 2 * Rc + 16, 12); ctx.stroke(); }

    drawSmoke(dt);
    const vg = ctx.createRadialGradient(W * .45, H * .4, 120, W * .5, H * .5, 560);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (!grab && time === 0) {
      ctx.font = '700 15px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(14,16,19,.8)'; ctx.beginPath(); ctx.roundRect(cx - 110, BAR_Y + Rc + 44, 220, 28, 8); ctx.fill();
      ctx.fillStyle = '#EEF0F3'; ctx.fillText('↑ chyť cívku a posouvej ↔', cx, BAR_Y + Rc + 63);
    }
    barProfile();
  }

  // graf teploty podél kulatiny
  function barProfile() {
    const PHt = 190, Y0 = 172, SCY = 140 / 1100, yT = t => Y0 - Math.max(0, t) * SCY;
    const bgG = pctx.createLinearGradient(0, 0, 0, PHt);
    bgG.addColorStop(0, '#1b1f25'); bgG.addColorStop(1, '#0f1114');
    pctx.fillStyle = bgG; pctx.fillRect(0, 0, W, PHt);
    // cílový pás a hranice přehřátí
    pctx.fillStyle = 'rgba(73,209,125,.16)'; pctx.fillRect(BAR_X0, yT(BAR_HI), BAR_X1 - BAR_X0, yT(BAR_LO) - yT(BAR_HI));
    pctx.strokeStyle = 'rgba(255,90,90,.6)'; pctx.setLineDash([5, 5]);
    pctx.beginPath(); pctx.moveTo(BAR_X0, yT(BAR_BURN)); pctx.lineTo(BAR_X1, yT(BAR_BURN)); pctx.stroke(); pctx.setLineDash([]);
    // úseky
    bar.zones.forEach(([x0, x1], z) => { pctx.fillStyle = zoneDone[z] ? 'rgba(73,209,125,.12)' : 'rgba(255,255,255,.05)'; pctx.fillRect(x0, 24, x1 - x0, Y0 - 24); });
    // osa
    pctx.fillStyle = '#6B7482'; pctx.font = '500 10px JetBrains Mono, monospace'; pctx.textAlign = 'right';
    for (const t of [0, 500, 1000]) { pctx.fillText(t + ' °C', BAR_X0 - 4, yT(t) + 3); pctx.fillStyle = 'rgba(255,255,255,.06)'; pctx.fillRect(BAR_X0, yT(t), BAR_X1 - BAR_X0, 1); pctx.fillStyle = '#6B7482'; }
    // křivka teploty
    pctx.beginPath(); pctx.moveTo(BAR_X0, Y0);
    for (let i = 0; i < BN; i++) pctx.lineTo(BAR_X0 + i * BC + 2.5, yT(BT[i]));
    pctx.lineTo(BAR_X1, Y0); pctx.closePath();
    const g = pctx.createLinearGradient(0, yT(1100), 0, Y0);
    g.addColorStop(0, '#ffe678'); g.addColorStop(.25, '#ff8c1e'); g.addColorStop(.45, '#d23c14'); g.addColorStop(.62, '#7a2a20'); g.addColorStop(1, '#3a3e44');
    pctx.fillStyle = g; pctx.fill();
    pctx.beginPath(); for (let i = 0; i < BN; i++) { const x = BAR_X0 + i * BC + 2.5; i ? pctx.lineTo(x, yT(BT[i])) : pctx.moveTo(x, yT(BT[i])); }
    pctx.strokeStyle = 'rgba(255,255,255,.7)'; pctx.lineWidth = 1.2; pctx.stroke();
    // poloha cívky
    pctx.fillStyle = 'rgba(255,146,84,.18)'; pctx.fillRect(coil.x - COIL_HALF, 24, 2 * COIL_HALF, Y0 - 24);
    pctx.font = '600 11px JetBrains Mono, monospace'; pctx.textAlign = 'left'; pctx.fillStyle = '#9BA4B0';
    pctx.fillText('TEPLOTA PODÉL KULATINY · zelený pás = 750–900 °C · červená = přehřátí', BAR_X0, 16);
    const nd = zoneDone.filter(Boolean).length;
    pctx.textAlign = 'right'; pctx.fillStyle = nd === bar.zones.length ? '#49D17D' : '#FF9254';
    pctx.fillText(`úseky ${nd} / ${bar.zones.length}`, BAR_X1, 16);
  }

  // ================= VÝHRA, ÚROVNĚ, REKORDY =================
  function win(nb) {
    done = true; grab = false; cv.classList.remove('drag');
    const pts = Math.max(0, Math.round(1000 - time * (mode === 'bar' ? 3 : 4) - nb * (mode === 'bar' ? 5 : 0.6)));
    const key = mode[0] + lvl, prev = best[key] || 0, rec = pts > prev;
    if (rec) { best[key] = pts; saveBest(); }
    const list = LV(), last = lvl === list.length - 1;
    const sum = list.reduce((a, _, n) => a + (best[mode[0] + n] || 0), 0);
    const all = list.every((_, n) => best[mode[0] + n]);
    $('overTitle').textContent = last && all ? 'Všechny úrovně hotové! 🏆' : mode === 'bar' ? (nb === 0 ? 'Prohřáto akorát! 🔥' : 'Ohřáto!') : (nb === 0 ? 'Rovný jako stůl! 🔥' : 'Vyrovnáno!');
    $('overScore').textContent = pts;
    $('overText').innerHTML = `Čas ${time.toFixed(1).replace('.', ',')} s · ${mode === 'bar' ? 'přehřáto' : 'spáleno'} ${nb} míst<br>` +
      (rec ? 'Nový rekord úrovně!' : `Rekord úrovně: ${prev}`) + ` · celkem ${sum} bodů`;
    $('overBtn').textContent = last ? 'Znovu od 1. úrovně' : 'Pokračovat hned →';
    $('over').classList.add('show');
    renderLevels();
    setMsg(mode === 'bar' ? '<b>Kulatina je prohřátá a připravená k ohýbání!</b>' : '<b>Plech je rovný!</b>', 'good');
    // samo přejde na další úroveň
    if (!last) {
      let left = AUTO_NEXT;
      const tick = () => {
        $('autoNext').textContent = `Další úroveň „${list[lvl + 1].name}“ začne za ${left} s…`;
        if (left-- <= 0) { lvl++; startLevel(); return; }
        autoTimer = setTimeout(tick, 1000);
      };
      tick();
    } else $('autoNext').textContent = '';
  }
  const AUTO_NEXT = 5;
  let autoTimer = null;

  let best = {};
  try {
    best = JSON.parse(localStorage.getItem('dawell-dhi191-v2') || 'null') || {};
    if (!localStorage.getItem('dawell-dhi191-v2')) {                     // převzít rekordy ze starší verze
      const old = JSON.parse(localStorage.getItem('dawell-dhi191-urovne') || '[]');
      old.forEach((v, n) => { if (v) best['p' + n] = v; });
    }
  } catch (e) {}
  function saveBest() { try { localStorage.setItem('dawell-dhi191-v2', JSON.stringify(best)); } catch (e) {} }
  function renderLevels() {
    $('levels').innerHTML = LV().map((L, n) => {
      const b = best[mode[0] + n];
      return `<button class="lv${n === lvl ? ' cur' : ''}${b ? ' done' : ''}" data-l="${n}">
        <span class="n">Úroveň ${n + 1}</span><span class="t">${L.name}</span>
        <span class="s">${b ? '✓ ' + b + ' b.' : '—'}</span></button>`;
    }).join('');
  }
  $('levels').addEventListener('click', e => {
    const b = e.target.closest('.lv'); if (!b) return;
    lvl = +b.dataset.l; startLevel();
  });

  $('overBtn').addEventListener('click', () => { lvl = (lvl + 1) % LV().length; startLevel(); });
  $('restart').addEventListener('click', startLevel);
  $('next').addEventListener('click', () => { lvl = (lvl + 1) % LV().length; startLevel(); });
  $('gauge').addEventListener('click', () => {
    showGauge = !showGauge;
    $('gauge').textContent = '📏 Měřidlo boulí: ' + (showGauge ? 'zapnuto' : 'vypnuto');
    $('gauge').classList.toggle('on', showGauge);
  });
  $('field').addEventListener('click', () => {
    showField = !showField;
    $('field').textContent = '⚡ Ukázat indukci: ' + (showField ? 'zapnuto' : 'vypnuto');
    $('field').classList.toggle('on', showField);
  });

  function loop(now) {
    const dt = Math.min(0.04, (now - (last || now)) / 1000); last = now;
    if (mode === 'bar') { if (!done) barUpdate(dt); barDraw(now, dt); }
    else { if (!done) update(dt); draw(now, dt); }
    requestAnimationFrame(loop);
  }
  startLevel();
  requestAnimationFrame(loop);})();
</script>
</body>
